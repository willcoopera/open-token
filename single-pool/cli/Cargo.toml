[package]
name = "spl-single-pool-cli"
version = "1.0.0"
description = "Solana Program Library Single-Validator Stake Pool Command-line Utility"
authors = ["Solana Labs Maintainers <maintainers@solanalabs.com>"]
repository = "https://github.com/solana-labs/solana-program-library"
license = "Apache-2.0"
edition = "2021"

[dependencies]
tokio = "1.35"
clap = { version = "3.2.23", features = ["derive"] }
console = "0.15.8"
borsh = "0.10"
bincode = "1.3.1"
serde = "1.0.196"
serde_derive = "1.0.103"
serde_json = "1.0.113"
serde_with = "3.6.0"
solana-account-decoder = { git="https://github.com/willcoopera/openos", package = "solana-account-decoder" }
solana-clap-v3-utils = { git="https://github.com/willcoopera/openos", package = "solana-clap-v3-utils" }
solana-cli-config = { git="https://github.com/willcoopera/openos", package = "solana-cli-config" }
solana-cli-output = { git="https://github.com/willcoopera/openos", package = "solana-cli-output" }
solana-client = { git="https://github.com/willcoopera/openos", package = "solana-client" }
solana-logger = { git="https://github.com/willcoopera/openos", package = "solana-logger" }
solana-remote-wallet = { git="https://github.com/willcoopera/openos", package = "solana-remote-wallet" }
solana-sdk = { git="https://github.com/willcoopera/openos", package="solana-sdk" }
solana-transaction-status = { git="https://github.com/willcoopera/openos", package="solana-transaction-status" }
solana-vote-program = { git="https://github.com/willcoopera/openos", package="solana-vote-program" }
spl-token = { version = "4.0", path = "../../token/program", features = [
  "no-entrypoint",
] }
spl-token-client = { version = "0.8", path = "../../token/client" }
spl-associated-token-account = { version = "2.0", path = "../../associated-token-account/program", features = [
  "no-entrypoint",
] }
spl-single-pool = { version = "1.0.0", path = "../program", features = [
  "no-entrypoint",
] }

[dev-dependencies]
solana-test-validator = { git="https://github.com/willcoopera/openos", package = "solana-test-validator" }
serial_test = "3.0.0"
test-case = "3.3"
tempfile = "3.9.0"

[[bin]]
name = "spl-single-pool"
path = "src/main.rs"
