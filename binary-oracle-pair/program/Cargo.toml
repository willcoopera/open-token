[package]
name = "spl-binary-oracle-pair"
version = "0.1.0"
description = "Solana Program Library Binary Oracle Pair"
authors = ["Solana Labs Maintainers <maintainers@solanalabs.com>"]
repository = "https://github.com/solana-labs/solana-program-library"
license = "Apache-2.0"
edition = "2021"

[features]
test-sbf = []

[dependencies]
num-derive = "0.4"
num-traits = "0.2"
solana-program ={ git="https://github.com/openlab-openos/openos",rev="29f65361a99e24c1a98505e55ccd2a8b79e50e2d", package="solana-program" }
spl-token = { version = "4.0", path = "../../token/program", features = [ "no-entrypoint" ] }
thiserror = "1.0"
uint = "0.9"
borsh = "0.10"

[dev-dependencies]
solana-program-test = { git="https://github.com/openlab-openos/openos",rev="29f65361a99e24c1a98505e55ccd2a8b79e50e2d", package="solana-program-test" }
solana-sdk = { git="https://github.com/openlab-openos/openos",rev="29f65361a99e24c1a98505e55ccd2a8b79e50e2d", package="solana-sdk" }

[lib]
crate-type = ["cdylib", "lib"]
